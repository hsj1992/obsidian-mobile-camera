name: Release Obsidian Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (manual runs do not publish a release)'
        required: true
        default: '1.0.0'
        type: string
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate intended release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: node scripts/validate-release.mjs "$RELEASE_TAG"

      - name: Validate release, test and build
        run: npm run check

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            main.js
            manifest.json
            styles.css
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload main.js
        uses: actions/upload-artifact@v4
        with:
          name: main.js
          path: main.js
          if-no-files-found: error

      - name: Upload manifest.json
        uses: actions/upload-artifact@v4
        with:
          name: manifest.json
          path: manifest.json
          if-no-files-found: error

      - name: Upload styles.css
        uses: actions/upload-artifact@v4
        with:
          name: styles.css
          path: styles.css
          if-no-files-found: error
